      <a href="#/login" class="btn btn-secondary" style="width: 100%; justify-content: center;">
        <i class="ph-light ph-sign-in"></i> Iniciar Sesión

<script>
(function() {
  var hamburger = document.getElementById('navHamburger');
  var mobile = document.getElementById('navMobile');
  var mobileLinks = document.querySelectorAll('.navbar-mobile-link, .navbar-mobile-menu .btn');

  if (hamburger && mobile) {
    hamburger.addEventListener('click', function() {
      hamburger.classList.toggle('active');
      mobile.classList.toggle('active');
      document.body.style.overflow = mobile.classList.contains('active') ? 'hidden' : '';
    });

    mobileLinks.forEach(function(link) {
      link.addEventListener('click', function() {
        hamburger.classList.remove('active');
        mobile.classList.remove('active');
        document.body.style.overflow = '';
      });
    });
  }

  var loginBtn = document.getElementById('navLoginBtn');
  var userMenu = document.getElementById('navUserMenu');
  var userBtn = document.getElementById('navUserBtn');
  var userDropdown = document.getElementById('navDropdown');
  var userAvatar = document.getElementById('navUserAvatar');
  var userName = document.getElementById('navUserName');
  var dropdownName = document.getElementById('navDropdownName');
  var dropdownEmail = document.getElementById('navDropdownEmail');
  var adminLink = document.getElementById('navAdminLink');
  var logoutBtn = document.getElementById('navLogoutBtn');
  var mobileAuth = document.getElementById('navMobileAuth');
  var mobileUser = document.getElementById('navMobileUser');
  var mobileLogout = document.getElementById('navMobileLogout');

  function updateNavAuth() {
    var loggedIn = window.DyTAuth && DyTAuth.isLoggedIn();
    var user = loggedIn ? DyTAuth.getUser() : null;
    var isAdmin = user && user.role === 'admin';
    var clientLinks = document.querySelectorAll('.navbar-client-link');
    var adminLinks = document.querySelectorAll('.navbar-admin-link');

    if (loggedIn && user) {
      loginBtn.style.display = 'none';
      userMenu.style.display = 'block';
      var initial = (user.name || user.email || 'U').charAt(0).toUpperCase();
      userAvatar.textContent = initial;
      userName.textContent = user.name || 'Usuario';
      dropdownName.textContent = user.name || 'Usuario';
      dropdownEmail.textContent = user.email || '';

      clientLinks.forEach(function (el) {
        el.style.display = isAdmin ? 'none' : 'flex';
      });
      adminLinks.forEach(function (el) {
        el.style.display = isAdmin ? 'flex' : 'none';
      });

      if (mobileAuth) mobileAuth.style.display = 'none';
      if (mobileUser) mobileUser.style.display = 'block';
    } else {
      loginBtn.style.display = 'flex';
      userMenu.style.display = 'none';
      if (mobileAuth) mobileAuth.style.display = 'block';
      if (mobileUser) mobileUser.style.display = 'none';
    }
  }

  if (userBtn) {
    userBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      userMenu.classList.toggle('open');
    });
  }

  document.addEventListener('click', function() {
    if (userMenu) userMenu.classList.remove('open');
  });

  if (userDropdown) {
    userDropdown.addEventListener('click', function(e) {
      e.stopPropagation();
    });
  }

  if (logoutBtn) {
    logoutBtn.addEventListener('click', function() {
      if (window.DyTAuth) DyTAuth.logout();
    });
  }

  if (mobileLogout) {
    mobileLogout.addEventListener('click', function() {
      if (window.DyTAuth) DyTAuth.logout();
    });
  }

  document.addEventListener('auth:changed', updateNavAuth);
  window.addEventListener('hashchange', updateNavAuth);

  updateNavAuth();
})();
</script>
