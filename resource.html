<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recurso | Desarrollo y Tecnología - Enrique Galván</title>
  <link rel="icon" type="image/png" href="public/media/images/logo g.png">

  <!-- SEO -->
  <meta name="description" content="Academia DyT_EG - Videos, guías, cursos y plantillas para dominar las herramientas del desarrollo profesional. Aprende a tu ritmo.">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="DyT_EG">
  <meta property="og:title" content="DyT_EG | Academia - Aprende a tu ritmo">
  <meta property="og:description" content="Videos, guías, cursos y plantillas para dominar las herramientas que usamos en el desarrollo profesional. Recursos DyT_EG, aprende a tu ritmo.">
  <meta property="og:url" content="https://enrique-galvan-dyt.github.io/DyT_EnriqueGalvan/resource.html">
  <meta property="og:locale" content="es_MX">
  <meta property="og:image" content="https://enrique-galvan-dyt.github.io/DyT_EnriqueGalvan/public/media/images/Formato%20A%20v4.png">
  <meta property="og:image:width" content="1005">
  <meta property="og:image:height" content="245">
  <meta property="og:image:alt" content="DyT_EG Academia - Recursos de desarrollo y tecnología">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DyT_EG | Academia - Aprende a tu ritmo">
  <meta name="twitter:description" content="Videos, guías, cursos y plantillas para dominar las herramientas del desarrollo profesional. Recursos DyT_EG.">
  <meta name="twitter:image" content="https://enrique-galvan-dyt.github.io/DyT_EnriqueGalvan/public/media/images/Formato%20A%20v4.png">
  <meta name="twitter:image:alt" content="DyT_EG Academia - Recursos de desarrollo y tecnología">
</head>
<body data-page="resource" sections="checkout">

  <!-- Navbar -->
  <div id="navbar-container"></div>

  <section class="resource-detail-page">
    <div class="container">
      <!-- Loading state -->
      <div id="resourceLoading" class="resource-detail-loading">
        <div class="loading-spinner"></div>
        <p>Cargando recurso...</p>
      </div>

      <!-- Error state -->
      <div id="resourceError" class="resource-detail-error" style="display:none;">
        <i class="ph-light ph-warning-circle"></i>
        <p id="resourceErrorMsg">Recurso no encontrado</p>
        <a href="index.html#/academia" class="btn btn-secondary">Volver a Academia</a>
      </div>

      <!-- Content -->
      <div id="resourceContent" style="display:none;">
        <div class="resource-detail-header">
          <a href="index.html#/academia" class="resource-detail-back">
            <i class="ph-light ph-arrow-left"></i> Volver a Academia
          </a>
          <div class="resource-detail-meta">
            <span class="academia-badge" id="resourceBadge"></span>
            <span class="academia-duration" id="resourceDuration"></span>
          </div>
          <div class="resource-detail-heading">
            <img id="resourceThumb" class="resource-detail-thumb" alt="" style="display:none;">
            <div class="resource-detail-heading-info">
              <h1 class="resource-detail-title" id="resourceTitle"></h1>
              <p class="resource-detail-desc" id="resourceDesc"></p>
            </div>
          </div>
        </div>

        <!-- Purchase / owned state (recursos pagados) -->
        <div id="purchaseArea" class="resource-purchase" style="display:none;"></div>

        <!-- Locked state (recursos pagados no adquiridos) -->
        <div id="contentLock" class="resource-content-locked video-locked" style="display:none;">
          <i class="ph-light ph-lock-key"></i>
          <strong>Contenido exclusivo</strong>
          <p>Adquiere este recurso para desbloquear el contenido completo.</p>
          <div class="video-locked-actions" id="contentLockActions"></div>
        </div>

        <!-- Video section (video + curso categories) -->
        <div id="videoSection" class="resource-detail-section" style="display:none;">
          <h2 class="resource-detail-section-title"><i class="ph-light ph-video"></i> Contenido en video</h2>
          <div id="videoContainer" class="resource-video-container"></div>
        </div>

        <!-- Lessons section (curso category) -->
        <div id="lessonsSection" class="resource-detail-section" style="display:none;">
          <h2 class="resource-detail-section-title"><i class="ph-light ph-list"></i> Lecciones</h2>
          <div id="lessonsContainer" class="resource-lessons-list"></div>
        </div>

        <!-- Body content (CKEditor + placeholder injection) -->
        <div id="bodySection" class="resource-detail-section" style="display:none;">
          <div id="bodyContainer" class="resource-body-container"></div>
        </div>

        <!-- Reviews section (valoraciones) -->
        <div id="reviewsSection" class="resource-detail-section" style="display:none;">
          <h2 class="resource-detail-section-title"><i class="ph-light ph-star"></i> Valoraciones</h2>
          <div id="reviewsSummary" class="resource-reviews-summary"></div>
          <div id="reviewsForm" class="resource-review-form" style="display:none;"></div>
          <div id="reviewsList" class="resource-reviews-list"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer-container"></div>

  <!-- Modals (checkout/confirmacion) - inyectados por auralis -->
  <div id="section-checkout"></div>

  <!-- Toast Notification -->
  <div id="toastContainer" class="toast-container">
    <div id="toastMessage" class="toast-message"></div>
  </div>

  <script src="public/js/auralis.js"></script>
</body>
</html>
